<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let's Make a Solution</title>
  <style>
    :root {
      --bg: #07111f;
      --gold: #ffb900;
      --mint: #58e8cf;
      --text: #f5f7fb;
      --muted: #aab6c6;
      --glass: rgba(255,255,255,.72);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(1120px, 92%);
      margin: 0 auto;
      padding: 62px 0 55px;
    }

    h1 {
      margin: 0 0 72px;
      color: var(--gold);
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 5vw, 3.7rem);
      font-weight: 400;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 50px;
    }

    .controls {
      width: min(100%, 390px);
      justify-self: center;
    }

    .field { margin-bottom: 23px; }
    label {
      display: block;
      margin-bottom: 12px;
      font-size: 1.12rem;
    }

    select, textarea {
      width: 100%;
      border: 1px solid #cbd1d9;
      border-radius: 8px;
      background: #fff;
      color: #182333;
      font: inherit;
      font-size: 1.08rem;
      outline: none;
    }

    select {
      height: 48px;
      padding: 0 15px;
      cursor: pointer;
    }

    textarea {
      min-height: 106px;
      resize: vertical;
      padding: 12px;
      line-height: 1.5;
    }

    select:focus, textarea:focus {
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgba(88,232,207,.18);
    }

    .buttons {
      display: flex;
      gap: 36px;
      margin-top: 19px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 17px;
      background: var(--mint);
      color: #07302d;
      font: inherit;
      font-size: 1.08rem;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    button:hover {
      background: #79f5df;
      transform: translateY(-2px);
    }
    button:active { transform: translateY(0); }

    .visual {
      min-height: 440px;
      display: grid;
      place-items: center;
    }

    /* Beaker illustration made with CSS */
    .beaker {
      position: relative;
      width: 220px;
      height: 315px;
      border: 4px solid var(--glass);
      border-top: 0;
      border-radius: 8px 8px 48px 48px / 8px 8px 35px 35px;
      filter: drop-shadow(0 0 2px rgba(255,255,255,.35));
      overflow: hidden;
      transform: perspective(500px) rotateX(-1deg);
    }

    .beaker::before {
      content: "";
      position: absolute;
      top: -5px;
      left: -13px;
      width: calc(100% + 22px);
      height: 54px;
      border: 4px solid var(--glass);
      border-radius: 50%;
      background: var(--bg);
      z-index: 3;
    }

    .beaker::after {
      content: "";
      position: absolute;
      left: 1px;
      right: 1px;
      bottom: -12px;
      height: 54px;
      border: 3px solid rgba(255,255,255,.55);
      border-radius: 50%;
      z-index: 2;
    }

    .liquid {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28%;
      background: rgba(83, 190, 230, .32);
      border-top: 2px solid rgba(140,220,255,.65);
      transition: height .7s ease, background .5s ease;
      z-index: 1;
    }

    .liquid::before {
      content: "";
      position: absolute;
      left: -8%;
      top: -9px;
      width: 116%;
      height: 18px;
      border-radius: 50%;
      background: rgba(130,220,255,.2);
    }

    .measurements {
      position: absolute;
      z-index: 4;
      right: 34px;
      top: 112px;
      height: 145px;
      width: 25px;
      border-left: 2px solid rgba(255,255,255,.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .measurements span {
      width: 18px;
      border-top: 2px solid rgba(255,255,255,.35);
    }

    .particles {
      position: absolute;
      inset: 130px 24px 18px;
      z-index: 5;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f4d16b;
      opacity: 0;
      box-shadow: 0 0 7px rgba(255,220,120,.8);
    }

    .beaker.mixed .particle { animation: dissolve 1.1s ease forwards; }
    .beaker.mixed .particle:nth-child(2n) { animation-delay: .12s; }
    .beaker.mixed .particle:nth-child(3n) { animation-delay: .24s; }

    @keyframes dissolve {
      0% { opacity: 0; transform: translateY(-45px) scale(1.5); }
      35% { opacity: 1; }
      100% { opacity: .85; transform: translateY(70px) scale(.75); }
    }

    .beaker.mixed .liquid { height: 62%; }
    .beaker.mixed.sugar .liquid { background: rgba(110,190,245,.38); }
    .beaker.mixed.salt .liquid { background: rgba(80,190,225,.36); }
    .beaker.mixed.unsolved .liquid { background: rgba(180,150,100,.3); }

    .hint {
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.5;
      margin-top: 17px;
    }

    @media (max-width: 700px) {
      .page { padding-top: 38px; }
      h1 { margin-bottom: 38px; }
      .workspace { grid-template-columns: 1fr; gap: 15px; }
      .controls { width: min(100%, 430px); }
      .visual { min-height: 340px; }
      .beaker { transform: scale(.88); }
      .buttons { gap: 18px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Let’s make the Solution</h1>

    <section class="workspace">
      <div class="controls">
        <div class="field">
          <label for="solute">Choose a Solute:</label>
          <select id="solute">
            <option value="salt">Salt</option>
            <option value="sugar">Sugar</option>
            <option value="sand">Sand</option>
          </select>
        </div>

        <div class="field">
          <label for="solvent">Choose a Solvent:</label>
          <select id="solvent">
            <option value="water">Water</option>
            <option value="oil">Oil</option>
            <option value="alcohol">Alcohol</option>
          </select>
        </div>

        <div class="field">
          <label for="answer">The Answer</label>
          <textarea id="answer" readonly aria-live="polite"></textarea>
        </div>

        <div class="buttons">
          <button id="mixBtn" type="button">Mixed Up</button>
          <button id="resetBtn" type="button">Reset</button>
        </div>
        <p class="hint">Choose a solute and a solvent, then press “Mixed Up” to see what happens.</p>
      </div>

      <div class="visual" aria-label="Animated beaker illustration">
        <div class="beaker" id="beaker">
          <div class="liquid"></div>
          <div class="measurements">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="particles" id="particles">
            <i class="particle" style="left:12%;top:8%"></i>
            <i class="particle" style="left:32%;top:20%"></i>
            <i class="particle" style="left:55%;top:5%"></i>
            <i class="particle" style="left:75%;top:28%"></i>
            <i class="particle" style="left:20%;top:48%"></i>
            <i class="particle" style="left:48%;top:42%"></i>
            <i class="particle" style="left:68%;top:58%"></i>
            <i class="particle" style="left:37%;top:70%"></i>
            <i class="particle" style="left:85%;top:75%"></i>
            <i class="particle" style="left:8%;top:78%"></i>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const soluteSelect = document.getElementById("solute");
    const solventSelect = document.getElementById("solvent");
    const answer = document.getElementById("answer");
    const beaker = document.getElementById("beaker");
    const mixBtn = document.getElementById("mixBtn");
    const resetBtn = document.getElementById("resetBtn");

    function mixSolution() {
      const solute = soluteSelect.value;
      const solvent = solventSelect.value;
      const names = {
        salt: "Salt",
        sugar: "Sugar",
        sand: "Sand",
        water: "Water",
        oil: "Oil",
        alcohol: "Alcohol"
      };

      const dissolves = {
        salt: ["water"],
        sugar: ["water", "alcohol"],
        sand: []
      };

      const soluteName = names[solute];
      const solventName = names[solvent];
      const canDissolve = dissolves[solute].includes(solvent);

      beaker.classList.remove("mixed", "salt", "sugar", "unsolved");
      void beaker.offsetWidth; // Restart the particle animation.
      beaker.classList.add("mixed", canDissolve ? solute : "unsolved");

      if (canDissolve) {
        answer.value = `${soluteName} dissolves in ${solventName}. A solution is formed. ${soluteName} is the solute and ${solventName} is the solvent.`;
      } else {
        answer.value = `${soluteName} does not dissolve well in ${solventName}. A uniform solution is not formed. Try choosing another combination.`;
      }
    }

    function resetExperiment() {
      soluteSelect.value = "salt";
      solventSelect.value = "water";
      answer.value = "";
      beaker.classList.remove("mixed", "salt", "sugar", "unsolved");
    }

    mixBtn.addEventListener("click", mixSolution);
    resetBtn.addEventListener("click", resetExperiment);
  </script>
</body>
</html>
